name: Verify published (TEMPORARY)
on:
  push:
    branches: [claude/busy-franklin-9x9zpa]
    paths: ['.github/workflows/verify-tmp.yml']
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          tools: composer:v2
          coverage: none
      - run: composer install --no-interaction --prefer-dist --no-progress
      - run: php ci/verify-published.php v1.12.1 2e3b3c5160ffc498e75b547543ae44c708dc37f1
